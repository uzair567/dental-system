<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — Meridian Dental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand-mark">M</div>
    <h1>Staff Portal</h1>
    <p class="sub">Sign in to manage patients, appointments and records.</p>
    <div id="login-err" style="color:#c0442d;font-size:.85rem;margin-bottom:12px;"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" name="email" required autofocus></div>
      <div class="field"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="demo-creds">
      <b>Demo accounts</b><br>
      Super Admin: admin@clinic.com / admin123<br>
      Dentist: dr.sara@clinic.com / dentist123<br>
      Receptionist: reception@clinic.com / reception123
    </div>
  </div>
</div>

<div id="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-mark">M</span> Meridian Dental</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-user">
      <div id="sidebar-user-name"></div>
      <span class="role-tag" id="sidebar-user-role"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </aside>
  <main class="content" id="main-content"></main>
</div>

<div class="modal-backdrop" id="modal-backdrop"></div>

<script src="app.js"></script>
<script src="views-overview.js"></script>
<script src="views-patients.js"></script>
<script src="views-clinical.js"></script>
<script src="views-leads.js"></script>
<script src="views-appointments.js"></script>
<script src="views-billing.js"></script>
<script src="views-doctors.js"></script>
<script src="views-services.js"></script>
<script src="views-messages.js"></script>
<script src="views-reports.js"></script>
<script src="views-activity.js"></script>
</body>
</html>
