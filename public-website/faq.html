<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQs — Meridian Dental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" data-header></header>

<div class="page-head">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / FAQs</div>
    <h1>Frequently asked questions</h1>
    <p>Can't find your answer here? <a href="contact.html" style="text-decoration:underline;">Send us a message</a> and we'll get back to you.</p>
  </div>
</div>

<section class="wrap-narrow" style="max-width:820px;padding:0 28px;">
  <div id="faq-list"></div>
</section>

<footer data-footer></footer>
<script src="common.js"></script>
<script>
const FAQS = [
  ['Do I need to pay online when booking?', 'No. Online booking only reserves your slot — payment happens at the clinic after your visit, or as agreed with your dentist for larger treatment plans.'],
  ['What should I bring to my first visit?', 'A valid ID and any previous dental records or X-rays you have. If you\'re on regular medication, bring a list of what you take.'],
  ['Can I reschedule or cancel an appointment?', 'Yes — call, WhatsApp, or email us as early as possible and our front desk will move your slot to a time that works.'],
  ['Do you treat children?', 'Yes, both our dentists see patients of all ages, including first dental visits for young children.'],
  ['Is teeth whitening safe?', 'Our in-clinic whitening is supervised by a dentist and uses controlled concentrations — it\'s considered safe for most adult patients. We\'ll review your history first.'],
  ['How soon can I get an appointment?', 'Most requests are confirmed within a few hours during clinic hours. Urgent pain or emergencies are prioritised — mention this when you book or call directly.'],
];
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('faq');
  document.getElementById('faq-list').innerHTML = FAQS.map(([q, a], i) => `
    <div class="faq-item" data-i="${i}">
      <div class="faq-q">${q} <span class="chev">⌄</span></div>
      <div class="faq-a">${a}</div>
    </div>`).join('');
  document.querySelectorAll('.faq-item').forEach(item => {
    item.querySelector('.faq-q').addEventListener('click', () => item.classList.toggle('open'));
  });
});
</script>
</body>
</html>
