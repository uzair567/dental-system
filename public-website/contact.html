<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Meridian Dental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" data-header></header>

<div class="page-head">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / Contact</div>
    <h1>Get in touch</h1>
    <p>Questions about a treatment, pricing, or just want to talk before booking? Reach us any of these ways.</p>
  </div>
</div>

<section>
  <div class="container grid-2">
    <div>
      <div class="card" style="margin-bottom:16px;"><h3>Call or WhatsApp</h3><p id="c-phone"></p></div>
      <div class="card" style="margin-bottom:16px;"><h3>Email</h3><p id="c-email"></p></div>
      <div class="card" style="margin-bottom:16px;"><h3>Visit us</h3><p id="c-address"></p></div>
      <div class="card"><h3>Hours</h3><p id="c-hours"></p></div>
    </div>

    <div class="form-shell">
      <h3 style="margin-bottom:20px;">Send a message</h3>
      <div id="form-msg"></div>
      <form id="contact-form">
        <div class="field-row">
          <div class="field"><label>Full name</label><input type="text" name="name" required></div>
          <div class="field"><label>Phone</label><input type="tel" name="phone"></div>
        </div>
        <div class="field"><label>Email</label><input type="email" name="email"></div>
        <div class="field"><label>Subject</label><input type="text" name="subject" placeholder="e.g. Question about braces pricing"></div>
        <div class="field"><label>Message</label><textarea name="message" required placeholder="How can we help?"></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Send message</button>
      </form>
    </div>
  </div>
</section>

<footer data-footer></footer>
<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('contact');
  document.getElementById('c-phone').textContent = CLINIC.phone;
  document.getElementById('c-email').textContent = CLINIC.email;
  document.getElementById('c-address').textContent = CLINIC.address;
  document.getElementById('c-hours').textContent = CLINIC.hours;

  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    const msgBox = document.getElementById('form-msg');
    try {
      const res = await api('/website/contact', { method: 'POST', body: JSON.stringify(body) });
      msgBox.innerHTML = `<div class="form-msg ok">${res.message}</div>`;
      e.target.reset();
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg err">${err.message}</div>`;
    }
  });
});
</script>
</body>
</html>
