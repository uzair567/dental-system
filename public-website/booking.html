<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — Meridian Dental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" data-header></header>

<div class="page-head">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / Book an Appointment</div>
    <h1>Book an appointment</h1>
    <p>Tell us what you need and when works — our front desk confirms every request by phone or WhatsApp.</p>
  </div>
</div>

<section>
  <div class="container" style="max-width:680px;">
    <div class="form-shell">
      <div id="form-msg"></div>
      <form id="booking-form">
        <div class="field-row">
          <div class="field"><label>Full name</label><input type="text" name="name" required></div>
          <div class="field"><label>Phone number</label><input type="tel" name="phone" required placeholder="03xx xxxxxxx"></div>
        </div>
        <div class="field"><label>Email (optional)</label><input type="email" name="email"></div>

        <div class="field-row">
          <div class="field">
            <label>Service</label>
            <select name="service_id" id="service-select" required><option value="">Loading services…</option></select>
          </div>
          <div class="field">
            <label>Preferred dentist (optional)</label>
            <select name="dentist_id" id="dentist-select"><option value="">No preference</option></select>
          </div>
        </div>

        <div class="field-row">
          <div class="field"><label>Preferred date</label><input type="date" name="date" required></div>
          <div class="field"><label>Preferred time</label><input type="time" name="time" required></div>
        </div>

        <div class="field"><label>Notes (optional)</label><textarea name="notes" placeholder="Anything we should know before your visit"></textarea></div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Request appointment</button>
        <p class="helper" style="margin-top:14px;text-align:center;">This reserves a request only — we'll confirm the exact time with you.</p>
      </form>
    </div>
  </div>
</section>

<footer data-footer></footer>
<script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  renderHeader('');
  const params = new URLSearchParams(location.search);
  const preService = params.get('service');
  const preDentist = params.get('dentist');

  try {
    const services = await api('/services/public');
    document.getElementById('service-select').innerHTML =
      '<option value="">Select a service</option>' +
      services.map(s => `<option value="${s.id}" ${s.id === preService ? 'selected' : ''}>${s.name} — Rs ${Number(s.price).toLocaleString()}</option>`).join('');
  } catch (e) {
    document.getElementById('service-select').innerHTML = '<option value="">Could not load services</option>';
  }

  try {
    const dentists = await api('/auth/dentists/public');
    document.getElementById('dentist-select').innerHTML +=
      dentists.map(d => `<option value="${d.id}" ${d.id === preDentist ? 'selected' : ''}>${d.name} — ${d.specialty || ''}</option>`).join('');
  } catch (e) { /* optional field, fine if unavailable */ }

  document.getElementById('booking-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    const msgBox = document.getElementById('form-msg');
    try {
      const res = await api('/appointments/book', { method: 'POST', body: JSON.stringify(body) });
      sessionStorage.setItem('lastBooking', JSON.stringify(res.confirmation));
      location.href = 'booking-confirmation.html';
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg err">${err.message}</div>`;
    }
  });
});
</script>
</body>
</html>
