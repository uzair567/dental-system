<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog & News — Meridian Dental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" data-header></header>

<div class="page-head">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / Blog</div>
    <h1>Blog & clinic news</h1>
    <p>Short, practical notes from our dentists — and updates from the clinic.</p>
  </div>
</div>

<section class="wrap-narrow" style="max-width:820px;padding:0 28px;">
  <div id="post-list"></div>
</section>

<footer data-footer></footer>
<script src="common.js"></script>
<script>
const POSTS = [
  ['12 Aug 2026', 'Why your gums bleed when you floss (and when to worry)', 'A little bleeding in the first week of flossing regularly is normal. Persistent bleeding is usually a sign of gum inflammation worth having checked.'],
  ['28 Jul 2026', 'Extended weekend hours starting this month', 'We\'re now open until 8 PM on Saturdays to make room for patients who can only come in after work.'],
  ['09 Jul 2026', 'Baby teeth cavities: treat or wait?', 'Cavities in baby teeth are not automatically left alone — depth and pain matter more than the fact that the tooth will eventually fall out.'],
  ['22 Jun 2026', 'What actually happens during a root canal', 'A walkthrough of the appointment itself, written to answer the questions patients ask most before the procedure.'],
];
document.addEventListener('DOMContentLoaded', () => {
  renderHeader('blog');
  document.getElementById('post-list').innerHTML = POSTS.map(([date, title, excerpt]) => `
    <div class="post-card">
      <div class="post-date">${date}</div>
      <div><h3>${title}</h3><p>${excerpt}</p></div>
    </div>`).join('');
});
</script>
</body>
</html>
